name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: false
        default: staging
        type: string
      ref:
        description: Commit SHA validated by the calling CI
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      ref:
        description: Commit SHA or ref to deploy. Leave blank to use the selected environment branch.
        required: false
        type: string
      deploy_graphql:
        description: Deploy the Sanity GraphQL API after the Studio deploy
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ inputs.environment || 'staging' }}
  TARGET_REF: ${{ inputs.ref || (inputs.environment == 'production' && 'main' || 'staging') }}

jobs:
  resolve-target:
    name: Resolve target SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Resolve checked out SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate target branch
        env:
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          if [ "$DEPLOY_ENV" != "staging" ] && [ "$DEPLOY_ENV" != "production" ]; then
            echo "::error::environmentはstagingまたはproductionを指定してください。"
            exit 1
          fi
          expected_branch="staging"
          if [ "$DEPLOY_ENV" = "production" ]; then
            expected_branch="main"
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/$expected_branch"; then
            echo "::error::指定したrefまたはSHAは${expected_branch}ブランチに含まれていません。"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ "$TARGET_SHA" != "$(git rev-parse "origin/$expected_branch")" ]; then
            echo "::error::この自動配備より新しいcommitがあります。最新commitのCI実行を使用してください。"
            exit 1
          fi

      - name: 対象SHA解決失敗時の案内
        if: ${{ failure() }}
        run: echo "::error::デプロイ対象SHAの解決に失敗しました。指定したrefまたはSHAを確認してください。"

  validate-release:
    name: Validate release before external changes
    needs: resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sanity-studio/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Check required release settings
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
          SANITY_PREVIEW_READ_TOKEN: ${{ secrets.SANITY_PREVIEW_READ_TOKEN }}
          IMG_KEY: ${{ secrets.IMG_KEY }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        shell: bash
        run: |
          required=(SUPABASE_PROJECT_REF SUPABASE_DB_URL VITE_SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN SANITY_AUTH_TOKEN SANITY_STUDIO_APP_ID)
          if [ "$DEPLOY_ENV" = "production" ]; then
            required+=(CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT CLOUDFLARE_PAGES_BRANCH PUBLIC_BASE_URL VITE_SUPABASE_URL)
          else
            required+=(SANITY_PREVIEW_READ_TOKEN IMG_KEY IMG_ORIGIN)
          fi
          missing=0
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::必要設定 $name が利用できません。対象Environmentの登録を確認してください。"
              missing=1
            fi
          done
          exit "$missing"

      # Automatic calls already passed these checks in CI at this SHA.
      - name: Validate manually selected release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx --no-install wrangler pages functions build functions --outfile "$RUNNER_TEMP/pages-functions-worker.js"
          npx --no-install wrangler deploy --env staging --dry-run --outdir "$RUNNER_TEMP/worker-staging-build"
          npm ci --prefix sanity-studio
          npm run build --prefix sanity-studio

      - name: Validate manually selected migrations
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          npx --no-install supabase start --exclude edge-runtime,imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector --yes
          npx --no-install supabase db reset --local --no-seed
          npx --no-install supabase test db --local

      - name: Stop validation database
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        run: npx --no-install supabase stop --no-backup

  database:
    name: Database migrations
    needs:
      - resolve-target
      - validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase connection target
        id: link
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node --input-type=module <<'NODE'
          let valid = false
          try {
            const url = new URL(process.env.SUPABASE_DB_URL)
            valid = ['postgres:', 'postgresql:'].includes(url.protocol) &&
              url.hostname.endsWith('.pooler.supabase.com') && url.port === '5432' &&
              url.username === 'postgres.' + process.env.SUPABASE_PROJECT_REF &&
              Boolean(url.password) && url.pathname === '/postgres'
          } catch {
            // Never print the URL or the parser error: both may include credentials.
          }
          if (!valid) {
            console.error('SUPABASE_DB_URL must target this environment project via the session pooler on port 5432')
            process.exit(1)
          }
          NODE

      - name: Check remote migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --no-install supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Preview pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --no-install supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --no-install supabase db push --db-url "$SUPABASE_DB_URL" --yes

      - name: Verify remote migration history
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx --no-install supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: マイグレーション失敗時の復旧案内
        if: ${{ failure() && steps.link.outcome == 'success' }}
        run: |
          echo "::error::Supabaseマイグレーションに失敗しました。マイグレーション履歴を自動修復しないでください。"
          echo "失敗したSQLを確認し、forward-fixマイグレーションで修正してください。必要な場合は、承認済みのSupabaseバックアップまたは復旧ポイントから復元してください。"
          echo "復旧方針の決定と対応が完了した後、同じ対象SHAを指定してこのワークフローを再実行してください。"

      - name: Supabase接続失敗時の案内
        if: ${{ failure() && steps.link.outcome == 'failure' }}
        run: |
          echo "::error::Supabase projectへの接続に失敗しました。DB停止やSQL不整合とは断定できません。"
          echo "管理者がGitHub EnvironmentとSupabase Dashboardで対象project ref、認証設定、DB接続制限を確認してください。設定値をログやIssueへ貼り付けないでください。"


  worker-staging:
    name: Worker (staging)
    needs:
      - resolve-target
      - database
    if: ${{ inputs.environment != 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SANITY_PREVIEW_READ_TOKEN: ${{ secrets.SANITY_PREVIEW_READ_TOKEN }}
          # IMG_KEY is shared via a repository secret, not an environment secret.
          IMG_KEY: ${{ secrets.IMG_KEY }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN SUPABASE_PROJECT_REF VITE_SUPABASE_ANON_KEY SANITY_PREVIEW_READ_TOKEN IMG_KEY IMG_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::必要設定 $name が利用できません。IMG_KEYはRepository Secret、それ以外はEnvironment stagingの登録先を確認してください。"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build frontend for staging
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SANITY_DATASET: staging
        run: npm run build

      - name: Prepare Worker secrets
        env:
          SANITY_PREVIEW_READ_TOKEN: ${{ secrets.SANITY_PREVIEW_READ_TOKEN }}
          IMG_KEY: ${{ secrets.IMG_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          SQUARE_MEMBER_FEE_PLAN_VARIATION_ID: ${{ secrets.SQUARE_MEMBER_FEE_PLAN_VARIATION_ID }}
          SQUARE_WEBHOOK_SIGNATURE_KEY: ${{ secrets.SQUARE_WEBHOOK_SIGNATURE_KEY }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const payload = {
            SANITY_PREVIEW_READ_TOKEN: process.env.SANITY_PREVIEW_READ_TOKEN,
            IMG_KEY: process.env.IMG_KEY,
          }
          // Allow code deployment before Sandbox setup; retain existing optional bindings.
          for (const name of [
            'SUPABASE_SERVICE_ROLE_KEY', 'SQUARE_ACCESS_TOKEN', 'SQUARE_LOCATION_ID',
            'SQUARE_MEMBER_FEE_PLAN_VARIATION_ID', 'SQUARE_WEBHOOK_SIGNATURE_KEY',
          ]) {
            if (process.env[name]) payload[name] = process.env[name]
          }
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(payload), { mode: 0o600 })
          NODE

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          npx --no-install wrangler deploy \
            --env staging \
            --keep-vars \
            --secrets-file "$SECRETS_FILE" \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "SUPABASE_ANON_KEY:$SUPABASE_ANON_KEY" \
            --var "IMG_ORIGIN:$IMG_ORIGIN" \
            --var "SANITY_DATASET:staging"

      - name: Remove temporary Worker secrets
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Record staging manual verification checklist
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## stagingの手動動作確認（未完了）

          Workerの配備は完了しました。実環境の動作確認は、Accessへログインして実施してください。
          自動配備の成功は、以下の確認完了を意味しません。

          - [ ] https://staging.hatarakibachi.com/ でAccessへログインできる
          - [ ] トップ・About・Memberが表示され、直接アクセス・再読み込みでも表示できる
          - [ ] 団員・ニュースが表示され、画像が読み込める
          - [ ] 開発者ツールで /api/web-members と /api/web-sitenews?limit=1 が200のJSONを返す
          - [ ] stagingのSanity Studioからプレビューを開ける
          - [ ] 未認証の /api/draft が401となる
          - [ ] 時間を置いて再確認し、継続したエラーがない

          このworkflowはAccessのサービス認証による自動smoke testを実行しません。
          EOF

      - name: Worker失敗時の案内
        if: ${{ failure() }}
        run: |
          echo "::error::Staging Workerのbuild/deployに失敗しました。"
          echo "Pages本番には影響しません。Cloudflare route・GitHub Environment設定・Worker logsを確認してください。"
  cms:
    name: Sanity Studio
    needs:
      - resolve-target
      - database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sanity-studio-deploy
      cancel-in-progress: false
    environment: ${{ inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: sanity-studio
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: sanity-studio/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install Studio dependencies
        run: npm ci

      - name: Build Studio
        env:
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
          SANITY_STUDIO_DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: npm run build

      - name: Validate Studio deployment target
        env:
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
        run: |
          if [ -z "$SANITY_STUDIO_APP_ID" ]; then
            echo "::error::このGitHub EnvironmentにSANITY_STUDIO_APP_IDが登録されていません。"
            exit 1
          fi

      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
          SANITY_STUDIO_DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: |
          npm run deploy -- --no-build --schema-required

      - name: Deploy GraphQL API (opt-in)
        if: ${{ vars.SANITY_DEPLOY_GRAPHQL == 'true' || inputs.deploy_graphql == true }}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
        run: npm run deploy-graphql

      - name: CMS失敗時の案内
        if: ${{ failure() }}
        run: echo "::error::Sanity Studioのビルドまたはデプロイに失敗しました。上記ログとSanityの認証・設定を確認してください。"

  frontend:
    name: Cloudflare Pages and Functions
    needs:
      - resolve-target
      - cms
    if: ${{ inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_SANITY_DATASET: ${{ env.DEPLOY_ENV }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Resolve checked out SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy Pages and Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "::error::このGitHub EnvironmentにCloudflareデプロイ用の設定値が登録されていません。"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_BRANCH" ]; then
            echo "::error::PagesへのデプロイにはCLOUDFLARE_PAGES_BRANCHの設定が必要です。"
            exit 1
          fi
          npx --no-install wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$CLOUDFLARE_PAGES_BRANCH" \
            --commit-hash "$TARGET_SHA"

      - name: Smoke test deployed Pages and Functions
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: npm run smoke

      - name: Frontend失敗時の案内
        if: ${{ failure() }}
        run: echo "::error::FrontendまたはPages Functionsのビルド・デプロイに失敗しました。上記ログとCloudflareの認証・設定を確認してください。"
