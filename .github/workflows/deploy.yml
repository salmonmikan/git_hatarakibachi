name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      ref:
        description: Commit SHA or ref to deploy. Leave blank to use the triggering SHA.
        required: false
        type: string
      deploy_graphql:
        description: Deploy the Sanity GraphQL API after the Studio deploy
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || github.sha) || github.event.workflow_run.head_sha }}

jobs:
  database:
    name: Database migrations
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Check remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase migration list

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase db push --dry-run --linked

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase db push --linked

      - name: Print migration recovery guidance
        if: ${{ failure() }}
        run: |
          echo "::error::Supabase migration failed. Do not repair migration history automatically."
          echo "Use a forward-fix migration after reviewing the failed SQL and restore from the approved Supabase backup or recovery point when required."
          echo "Re-run this workflow with the same target SHA after the recovery decision is complete."

  cms:
    name: Sanity Studio
    needs: database
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sanity-studio-deploy
      cancel-in-progress: false
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: sanity-studio
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: sanity-studio/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install Studio dependencies
        run: npm ci

      - name: Build Studio
        env:
          SANITY_STUDIO_PREVIEW_SECRET: ${{ secrets.SANITY_STUDIO_PREVIEW_SECRET }}
        run: npm run build

      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npm run deploy -- --no-build --schema-required

      - name: Deploy GraphQL API (opt-in)
        if: ${{ vars.SANITY_DEPLOY_GRAPHQL == 'true' || inputs.deploy_graphql == true }}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npm run deploy-graphql

  frontend:
    name: Cloudflare Pages and Functions
    needs: cms
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Resolve checked out SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy Pages and Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_BRANCH: ${{ vars.CLOUDFLARE_PAGES_BRANCH }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -eu
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "::error::Cloudflare deployment variables are not configured for this GitHub Environment."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_BRANCH" ]; then
            echo "::error::CLOUDFLARE_PAGES_BRANCH is required for Pages deployments."
            exit 1
          fi
          if [ "$DEPLOY_ENV" = "production" ]; then
            npx --no-install wrangler pages deploy dist \
              --project-name "$CLOUDFLARE_PAGES_PROJECT" \
              --branch "$CLOUDFLARE_PAGES_BRANCH" \
              --commit-hash "$TARGET_SHA"
          else
            npx --no-install wrangler pages deploy dist \
              --project-name "$CLOUDFLARE_PAGES_PROJECT" \
              --branch "$CLOUDFLARE_PAGES_BRANCH" \
              --commit-hash "$TARGET_SHA"
          fi
