name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      ref:
        description: Commit SHA or ref to deploy. Leave blank to use the selected environment branch.
        required: false
        type: string
      deploy_graphql:
        description: Deploy the Sanity GraphQL API after the Studio deploy
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || (inputs.environment == 'production' && 'main' || 'staging')) || github.event.workflow_run.head_sha }}

jobs:
  resolve-target:
    name: Resolve target SHA
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Resolve checked out SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate target branch
        env:
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          expected_branch="staging"
          if [ "$DEPLOY_ENV" = "production" ]; then
            expected_branch="main"
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" "origin/$expected_branch"; then
            echo "::error::指定したrefまたはSHAは${expected_branch}ブランチに含まれていません。"
            exit 1
          fi

      - name: 対象SHA解決失敗時の案内
        if: ${{ failure() }}
        run: echo "::error::デプロイ対象SHAの解決に失敗しました。指定したrefまたはSHAを確認してください。"

  database:
    name: Database migrations
    needs: resolve-target
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Check remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase db push --dry-run --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: マイグレーション失敗時の復旧案内
        if: ${{ failure() }}
        run: |
          echo "::error::Supabaseマイグレーションに失敗しました。マイグレーション履歴を自動修復しないでください。"
          echo "失敗したSQLを確認し、forward-fixマイグレーションで修正してください。必要な場合は、承認済みのSupabaseバックアップまたは復旧ポイントから復元してください。"
          echo "復旧方針の決定と対応が完了した後、同じ対象SHAを指定してこのワークフローを再実行してください。"


  worker:
    name: Worker (${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }})
    needs:
      - resolve-target
      - database
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    env:
      WORKER_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SANITY_PREVIEW_SECRET: ${{ secrets.SANITY_PREVIEW_SECRET }}
          VITE_SANITY_READ_TOKEN: ${{ secrets.VITE_SANITY_READ_TOKEN }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
          IMG_KEY: ${{ secrets.IMG_KEY }}
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_PROJECT_REF SUPABASE_ANON_KEY SANITY_PREVIEW_SECRET VITE_SANITY_READ_TOKEN IMG_ORIGIN IMG_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Environment $WORKER_ENV に $name が登録されていません。"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SANITY_READ_TOKEN: ${{ secrets.VITE_SANITY_READ_TOKEN }}
        run: npm run build

      - name: Prepare Worker secrets
        env:
          SANITY_PREVIEW_SECRET: ${{ secrets.SANITY_PREVIEW_SECRET }}
          IMG_KEY: ${{ secrets.IMG_KEY }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          fs.writeFileSync(
            process.env.SECRETS_FILE,
            JSON.stringify({
              SANITY_PREVIEW_SECRET: process.env.SANITY_PREVIEW_SECRET,
              IMG_KEY: process.env.IMG_KEY,
            }),
          )
          NODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          npx --no-install wrangler deploy \
            --env "$WORKER_ENV" \
            --secrets-file "$SECRETS_FILE" \
            --var "SUPABASE_URL:https://$SUPABASE_PROJECT_REF.supabase.co" \
            --var "SUPABASE_ANON_KEY:$SUPABASE_ANON_KEY" \
            --var "IMG_ORIGIN:$IMG_ORIGIN"

      - name: Smoke test Worker
        shell: bash
        run: |
          if [ "$WORKER_ENV" = "production" ]; then
            base_url="https://hatarakibachi.com"
          else
            base_url="https://staging.hatarakibachi.com"
          fi

          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/about" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/api/web-members" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/api/web-sitenews?limit=1" >/dev/null
          headers="$(curl --retry 8 --retry-delay 2 --retry-all-errors -fsSI -H 'Cookie: sanity-preview=1' "$base_url/about")"
          printf '%s\n' "$headers" | grep -qi '^x-robots-tag: noindex, nofollow'
          printf '%s\n' "$headers" | grep -qi '^cache-control: private, no-store'

      - name: Worker失敗時の案内
        if: ${{ failure() }}
        run: |
          echo "::error::Workerのbuild/deploy/smoke testに失敗しました。"
          echo "Pages projectは削除していません。Worker Route、GitHub Environment設定、Worker logsを確認してください。"

  cms:
    name: Sanity Studio
    needs:
      - resolve-target
      - database
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sanity-studio-deploy
      cancel-in-progress: false
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: sanity-studio
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: sanity-studio/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install Studio dependencies
        run: npm ci

      - name: Build Studio
        run: npm run build

      - name: Deploy Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
        run: |
          if [ -z "$SANITY_STUDIO_APP_ID" ]; then
            echo "::error::このGitHub EnvironmentにSANITY_STUDIO_APP_IDが登録されていません。"
            exit 1
          fi
          npm run deploy -- --no-build --schema-required

      - name: Deploy GraphQL API (opt-in)
        if: ${{ vars.SANITY_DEPLOY_GRAPHQL == 'true' || inputs.deploy_graphql == true }}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npm run deploy-graphql

      - name: CMS失敗時の案内
        if: ${{ failure() }}
        run: echo "::error::Sanity Studioのビルドまたはデプロイに失敗しました。上記ログとSanityの認証・設定を確認してください。"
