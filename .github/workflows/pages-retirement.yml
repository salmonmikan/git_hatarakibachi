name: Retire Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_PAGES to delete the Pages project and switch Workers to Custom Domains
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-retirement
  cancel-in-progress: false

jobs:
  production:
    name: Delete Pages and finalize production Worker
    if: ${{ inputs.confirmation == 'DELETE_PAGES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve main SHA
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Validate production settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SANITY_PREVIEW_SECRET: ${{ secrets.SANITY_PREVIEW_SECRET }}
          VITE_SANITY_READ_TOKEN: ${{ secrets.VITE_SANITY_READ_TOKEN }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_PROJECT_REF SUPABASE_ANON_KEY SANITY_PREVIEW_SECRET VITE_SANITY_READ_TOKEN IMG_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Environment production に $name が登録されていません。"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build production frontend before cutover
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SANITY_READ_TOKEN: ${{ secrets.VITE_SANITY_READ_TOKEN }}
        run: npm run build

      - name: Prepare Worker secrets
        env:
          SANITY_PREVIEW_SECRET: ${{ secrets.SANITY_PREVIEW_SECRET }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          fs.writeFileSync(
            process.env.SECRETS_FILE,
            JSON.stringify({ SANITY_PREVIEW_SECRET: process.env.SANITY_PREVIEW_SECRET }),
          )
          NODE

      - name: Delete Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages project delete git-hatarakibachi --yes

      - name: Deploy production Worker Custom Domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npx --no-install wrangler deploy \
              --config wrangler.custom-domain.jsonc \
              --env production \
              --secrets-file "$SECRETS_FILE" \
              --var "SUPABASE_URL:https://$SUPABASE_PROJECT_REF.supabase.co" \
              --var "SUPABASE_ANON_KEY:$SUPABASE_ANON_KEY" \
              --var "IMG_ORIGIN:$IMG_ORIGIN"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test production
        run: |
          base_url="https://hatarakibachi.com"
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/about" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/api/web-members" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/api/web-sitenews?limit=1" >/dev/null

  staging:
    name: Finalize staging Worker Custom Domain
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout same main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.production.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Build staging frontend
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SANITY_READ_TOKEN: ${{ secrets.VITE_SANITY_READ_TOKEN }}
        run: npm run build

      - name: Prepare Worker secrets
        env:
          SANITY_PREVIEW_SECRET: ${{ secrets.SANITY_PREVIEW_SECRET }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          fs.writeFileSync(
            process.env.SECRETS_FILE,
            JSON.stringify({ SANITY_PREVIEW_SECRET: process.env.SANITY_PREVIEW_SECRET }),
          )
          NODE

      - name: Deploy staging Worker Custom Domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          IMG_ORIGIN: ${{ vars.IMG_ORIGIN }}
          SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npx --no-install wrangler deploy \
              --config wrangler.custom-domain.jsonc \
              --env staging \
              --secrets-file "$SECRETS_FILE" \
              --var "SUPABASE_URL:https://$SUPABASE_PROJECT_REF.supabase.co" \
              --var "SUPABASE_ANON_KEY:$SUPABASE_ANON_KEY" \
              --var "IMG_ORIGIN:$IMG_ORIGIN"; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test staging
        run: |
          base_url="https://staging.hatarakibachi.com"
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/about" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/api/web-members" >/dev/null
          curl --retry 8 --retry-delay 2 --retry-all-errors -fsS "$base_url/api/web-sitenews?limit=1" >/dev/null
